name: demo-pages

on:
  push:
    branches: [main, master]
    paths:
      - "apps/web/**"
      - "packages/validation/**"
      - ".github/workflows/demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Resolve Pages paths
        run: |
          REPO="$(echo "$GITHUB_REPOSITORY" | cut -d/ -f2)"
          OWNER="$(echo "$GITHUB_REPOSITORY" | cut -d/ -f1)"
          echo "VITE_BASE_PATH=/$REPO/" >> "$GITHUB_ENV"
          echo "VITE_SITE_URL=https://$OWNER.github.io/$REPO/" >> "$GITHUB_ENV"
      - run: pnpm --filter web build
        env:
          VITE_DEMO_MODE: "true"
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
          VITE_SITE_URL: ${{ env.VITE_SITE_URL }}
      - run: node scripts/sitemap.mjs
        env:
          VITE_BASE_PATH: ${{ env.VITE_BASE_PATH }}
          VITE_SITE_URL: ${{ env.VITE_SITE_URL }}
      - run: cp apps/web/dist/index.html apps/web/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
